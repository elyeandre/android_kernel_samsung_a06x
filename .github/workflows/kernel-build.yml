name: Kernel Build (build.sh)

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Maximize disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev python3 \
            git kmod device-tree-compiler \
            lz4 xz-utils zlib1g-dev

      - name: Build kernel
        id: build
        run: bash build.sh --skip-deps
        continue-on-error: true

      - name: Verify kernel
        id: verify
        run: |
          if [[ -f "dist/Image" ]]; then
            echo "[OK] Kernel built successfully"
            ls -lh dist/Image*
            echo "image_found=true" >> $GITHUB_OUTPUT
          else
            echo "[ERROR] Image not found in dist/"
            exit 1
          fi

      - name: Upload kernel artifact
        if: steps.verify.outputs.image_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel-${{ github.run_number }}
          path: dist/
          retention-days: 30
          compression-level: 9

      - name: Upload logs on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: out/
          retention-days: 7
