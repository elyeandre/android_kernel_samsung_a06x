name: Kernel Build · SM-A066B One UI 7

on:
  push:
    branches: main
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Build/artifact version tag (e.g. 1.0.0). Does NOT change vermagic."
        required: false
        default: "dev"
      build_variant:
        description: "Build variant (e.g. KernelSU-Next, KernelSU-Next+DroidSpaces)"
        required: false
        default: "KernelSU-Next"
      kmi_localversion:
        description: "CONFIG_LOCALVERSION only (build id). '-android13-8' is added automatically. Mode A: leave EMPTY -> -30546824 (stock KMI, boot.img alone). Mode B: e.g. -a06x-dev (then flash ALL 3 images)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build — A066BXXS3AYI3
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARTIFACT_BASE: "Kernel-SM-A066B-OneUI7-A066BXXS3AYI3"
      BUILD_VARIANT: ${{ github.event.inputs.build_variant || 'KernelSU-Next' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Maximize disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Generate release tag
        id: tag
        run: |
          TAG="r$(date -u +'%Y%m%d')-$(openssl rand -hex 4)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG}"

      - name: Get KernelSU-Next version
        id: ksu
        run: |
          cd kernel-5.15/KernelSU-Next
          KSU_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "unknown")
          KSU_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "0")
          KSU_VERSION=$((30000 + KSU_COUNT))
          echo "tag=${KSU_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${KSU_VERSION}" >> "$GITHUB_OUTPUT"
          echo "KernelSU-Next: ${KSU_TAG} (${KSU_VERSION})"

      - name: Build kernel
        id: build
        env:
          BUILD_KERNEL_VERSION: ${{ github.event.inputs.kernel_version || 'dev' }}
          # Empty => build.sh falls back to the stock KMI string (Mode A).
          KMI_LOCALVERSION: ${{ github.event.inputs.kmi_localversion }}
          # build.sh now rebuilds vendor_dlkm/vendor_boot AND packages the
          # flashable zip itself (dist/<RELEASE_NAME>.zip). Name it to match the
          # release tag so the later upload/release steps can find it.
          RELEASE_NAME: ${{ env.ARTIFACT_BASE }}-${{ steps.tag.outputs.tag }}
        run: bash build.sh
        continue-on-error: true

      - name: Verify kernel
        id: verify
        run: |
          if [[ -f "dist/boot.img" ]]; then
            echo "[OK] Kernel built successfully"
            ls -lh dist/
            echo "image_found=true" >> $GITHUB_OUTPUT
          else
            echo "[ERROR] boot.img not found in dist/"
            exit 1
          fi

      - name: Generate built modules list
        if: steps.build.outcome != 'cancelled'
        run: |
          find out/target/product/a06x/obj/KERNEL_OBJ -name "*.ko" \
            -exec basename {} \; 2>/dev/null | sort -u > dist/built_modules.txt
          echo "[INFO] Found $(wc -l < dist/built_modules.txt) compiled modules"

      - name: Package kernel modules (.ko) as zip
        id: modzip
        if: steps.build.outcome != 'cancelled'
        run: |
          set -euo pipefail
          MODROOT="dist/modules"
          rm -rf "$MODROOT"; mkdir -p "$MODROOT"
          # Collect every compiled .ko (MT76x2U USB Wi-Fi stack + all others)
          find out/target/product/a06x/obj/KERNEL_OBJ -name '*.ko' -print0 \
            | xargs -0 -r cp -n -t "$MODROOT/" 2>/dev/null || true
          COUNT=$(find "$MODROOT" -name '*.ko' | wc -l)
          echo "[INFO] Collected ${COUNT} kernel modules"
          if [[ "$COUNT" -eq 0 ]]; then
            echo "[WARN] No .ko found — skipping modules zip"
            echo "made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Load-order + firmware hint for the MT76x2U USB Wi-Fi stack
          printf '%s\n' \
            "MT76x2U USB Wi-Fi (MT7612U) — insmod in this order:" \
            "  mt76.ko" \
            "  mt76-usb.ko" \
            "  mt76x02-lib.ko" \
            "  mt76x02-usb.ko" \
            "  mt76x2-common.ko" \
            "  mt76x2u.ko" \
            "" \
            "(cfg80211/mac80211 are already resident on the device.)" \
            "" \
            "Firmware required in /vendor/firmware (from linux-firmware):" \
            "  mt7662.bin, mt7662_rom_patch.bin" \
            > "$MODROOT/README-mt76x2u.txt"
          NAME="${ARTIFACT_BASE}-${{ steps.tag.outputs.tag }}-modules"
          (cd dist && zip -qr "../${NAME}.zip" modules)
          echo "[OK] Created ${NAME}.zip (${COUNT} modules)"
          echo "MODULES_ZIP=${NAME}.zip"      >> "$GITHUB_ENV"
          echo "MODULES_ZIP_NAME=${NAME}"     >> "$GITHUB_ENV"
          echo "made=true" >> "$GITHUB_OUTPUT"

      - name: Upload modules zip
        if: steps.modzip.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULES_ZIP_NAME }}
          path: ${{ env.MODULES_ZIP }}
          retention-days: 30

      - name: Package MT76x2U KernelSU/Magisk module
        id: ksumod
        if: steps.build.outcome != 'cancelled'
        run: |
          NAME="${ARTIFACT_BASE}-${{ steps.tag.outputs.tag }}-mt76x2u-ksu-module"
          if bash ksu_module/build_module_zip.sh "dist/${NAME}.zip"; then
            echo "KSU_MODULE_ZIP=dist/${NAME}.zip" >> "$GITHUB_ENV"
            echo "KSU_MODULE_NAME=${NAME}"          >> "$GITHUB_ENV"
            echo "made=true" >> "$GITHUB_OUTPUT"
          else
            echo "[WARN] MT76x2U module not packaged (mt76x2u.ko not built?)"
            echo "made=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload MT76x2U KSU module
        if: steps.ksumod.outputs.made == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KSU_MODULE_NAME }}
          path: ${{ env.KSU_MODULE_ZIP }}
          retention-days: 30

      # vendor_dlkm/vendor_boot rebuild + release packaging now happen inside
      # build.sh (so a VPS build produces the same zip). Just locate it here.
      - name: Locate release package
        if: steps.verify.outputs.image_found == 'true'
        run: |
          NAME="${ARTIFACT_BASE}-${{ steps.tag.outputs.tag }}"
          ZIP="dist/${NAME}.zip"
          [ -f "$ZIP" ] || { echo "[ERROR] ${ZIP} not produced by build.sh"; ls -lh dist/; exit 1; }
          echo "ARCHIVE=${ZIP}"    >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "[OK] ${ZIP}"; unzip -l "$ZIP"

      - name: Upload artifact
        if: steps.verify.outputs.image_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE }}
          retention-days: 30

      - name: Upload kernel Image (raw + gz)
        # Both variants, for repacking into a known-good boot.img yourself:
        #   magiskboot unpack working_boot.img && cp Image kernel && magiskboot repack working_boot.img
        # Use the RAW Image for that — magiskboot re-compresses it to match the
        # template image's format automatically. Image.gz is what CI packs.
        if: steps.build.outcome != 'cancelled'
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ steps.tag.outputs.tag }}
          path: |
            dist/Image
            dist/Image.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Upload modules list
        if: steps.build.outcome != 'cancelled'
        uses: actions/upload-artifact@v4
        with:
          name: built-modules-${{ github.run_number }}
          path: dist/built_modules.txt
          retention-days: 30

      - name: Create GitHub Release
        if: steps.verify.outputs.image_found == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "${{ env.BUILD_VARIANT }} · SM-A066B · One UI 7 · A066BXXS3AYI3 [${{ steps.tag.outputs.tag }}]"
          body: |
            ## ${{ env.BUILD_VARIANT }} Kernel — SM-A066B

            | Field              | Value                                                |
            |--------------------|------------------------------------------------------|
            | Device             | Samsung Galaxy A06X (SM-A066B)                       |
            | Firmware           | A066BXXS3AYI3                                        |
            | One UI             | 7 (Android 15)                                       |
            | Kernel             | 5.15                                                 |
            | Variant            | `${{ env.BUILD_VARIANT }}`                           |
            | KernelSU-Next      | `${{ steps.ksu.outputs.tag }}` (`${{ steps.ksu.outputs.version }}`) |
            | Build tag          | `${{ steps.tag.outputs.tag }}`                       |
            | Version            | `${{ github.event.inputs.kernel_version || 'dev' }}` |
            | vermagic           | `5.15.151-android13-8${{ github.event.inputs.kmi_localversion || '-30546824' }}` |
            | Flash mode         | ${{ github.event.inputs.kmi_localversion && '**Mode B** — custom KMI, flash ALL THREE images together' || '**Mode A** — stock KMI, `boot.img` alone is enough' }} |

            ### Flashing — the zip contains a folder with:
            - **`…-<tag>.tar`** → Odin **AP** slot (this is `boot.img` + `vendor_boot.img`, both physical partitions)
            - **`vendor_dlkm.img`** → **fastbootD**, *not* Odin. `vendor_dlkm` is a logical partition inside `super`, so Odin can't write it:
              ```
              adb reboot fastboot
              fastboot flash vendor_dlkm vendor_dlkm.img
              fastboot reboot
              ```
            - **`FLASH.txt`** → the same steps, offline.

            ${{ github.event.inputs.kmi_localversion && '**Mode B (custom vermagic):** stock vendor modules will NOT load, so you MUST flash both the AP tar (Odin) and `vendor_dlkm.img` (fastbootD) from THIS build.' || '**Mode A (stock KMI):** for a kernel-only update you can flash `boot.img` alone and keep your current vendor images. Flash the tar + `vendor_dlkm.img` when you also want the rebuilt vendor (e.g. the gen4m fix).' }}

            Kernel modules (`.ko`) are attached separately as **`…-modules.zip`**,
            including the **MT76x2U** USB Wi-Fi stack (MT7612U dongles).
            See `README-mt76x2u.txt` inside for insmod order and required firmware.

            **`…-mt76x2u-ksu-module.zip`** is a flashable **KernelSU-Next / Magisk**
            module: it bundles the mt76 stack + `mt7662` firmware and loads them
            systemlessly (no `vendor` repack). Install in the KSU-Next manager and
            reboot; plug the dongle after boot.

            > ⚠️ Automated build — flash at your own risk.
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.MODULES_ZIP }}
            ${{ env.KSU_MODULE_ZIP }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload logs on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: out/
          retention-days: 7

  # Runs on its own runner CONCURRENTLY with the kernel build above, so it costs
  # ~no extra wall-clock time. Emits the wpa_supplicant-wlan1-aarch64 artifact
  # into this same run, next to the kernel artifacts.
  wpa:
    name: Static wpa_supplicant (parallel)
    uses: ./.github/workflows/wpa-supplicant.yml
