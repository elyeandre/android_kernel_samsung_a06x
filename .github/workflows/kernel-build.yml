name: Kernel Build (build.sh)

on:
  push:
    branches: main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Maximize disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Build kernel
        id: build
        env:
          BUILD_KERNEL_VERSION: r${{ github.run_number }}
        run: bash build.sh
        continue-on-error: true

      - name: Verify kernel
        id: verify
        run: |
          if [[ -f "dist/boot.img" ]]; then
            echo "[OK] Kernel built successfully"
            ls -lh dist/
            echo "image_found=true" >> $GITHUB_OUTPUT
          else
            echo "[ERROR] boot.img not found in dist/"
            exit 1
          fi

      - name: Upload kernel artifact
        if: steps.verify.outputs.image_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gki-kernel-${{ github.run_number }}
          path: |
            dist/boot.img
            dist/kernel-a06x-*.tar
          retention-days: 30
          compression-level: 9

      - name: Create GitHub Release
        if: steps.verify.outputs.image_found == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ github.run_number }}
          name: "Kernel A06X r${{ github.run_number }}"
          body: |
            ## Samsung Galaxy A06X Custom Kernel

            **Build:** r${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### Flash Instructions
            1. Download `kernel-a06x-r${{ github.run_number }}.tar`
            2. Flash via Odin as **AP**
            3. Do not wipe data
          files: |
            dist/boot.img
            dist/kernel-a06x-r${{ github.run_number }}.tar

      - name: Upload logs on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: out/
          retention-days: 7
